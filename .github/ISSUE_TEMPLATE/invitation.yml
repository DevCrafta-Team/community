name: Invite me to the DevCrafta Team

description: I would like to be part of the awesome Huniko team

title: "Please invite me to the DevCrafta team"

labels: [✉️ github-invitation]

body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Insert your name here
    validations:
      required: true

  - type: textarea
    id: Additional
    attributes:
      label: Additional Context
      description: Where did you meet DevCrafta Team? What do you like about this DevCrafta Team? Why do you want to join?
      placeholder: I would like to be part of the awesome team
    validations:
      required: false
